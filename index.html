---
layout: default
title: Home
---

<h2>Recent Posts</h2>

<ul class="post-list">
{% for post in site.posts limit:3 %}
  <li>
    <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span> |
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </li>
{% endfor %}
</ul>

<p><a href="{{ site.baseurl }}/blog/" class="see-more">See more →</a></p>

<p style="text-align: center;">To get notified about new posts, sign up here:</p>
{% include convertkit_signup.html %}
