# Site settings
title: Rachit Pareek
description: Personal website and blog
url: "https://rachithpareek.com"
baseurl: ""

# Build settings
markdown: kramdown
permalink: /blog/:title/

# Plugins
plugins:
  - jekyll-feed

# Author (for RSS feed)
author:
  name: Rachit Pareek

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - plan.markdown
  - README.txt
  - LICENSE.txt

